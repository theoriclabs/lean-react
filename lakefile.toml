# LeanApp portable workspace. Preserve the Lake package name for existing consumers.
name = "leanreact"
version = "0.1.0"
defaultTargets = ["LeanOntology", "LeanContract", "LeanApp", "LeanReact", "LeanJS", "LeanReact.Compiler"]

[[input_file]]
name = "leanJsRuntime"
path = "engine/LeanJS/Runtime.js"
text = true

[[lean_lib]]
name = "LeanOntology"
srcDir = "engine"

[[lean_lib]]
name = "LeanContract"
srcDir = "engine"

[[lean_lib]]
name = "LeanApp"
srcDir = "engine"

[[lean_lib]]
name = "LeanReact"
srcDir = "engine"

[[lean_lib]]
name = "LeanJS"
srcDir = "engine"
needs = ["leanJsRuntime"]

[[lean_lib]]
name = "Examples"
srcDir = "examples/lean"

[[lean_lib]]
name = "Ordering"
srcDir = "examples/ordering"

[[lean_lib]]
name = "Cafe"
srcDir = "examples/ordering"

[[lean_lib]]
name = "PrivateNotes"
srcDir = "examples/security"
