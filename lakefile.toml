# LeanReact: the UI layer (LeanReact, LeanReact.Domain, LeanJS) and full-stack serving
# (LeanReact.Server). It builds on the layers below it, required from git at pinned revisions:
# leanontology (wire codecs, scalars), LeanDB (`LeanDb.Model`, native storage) and LeanAPI
# (`LeanApi.Core`, `LeanContract`, native serving). LeanAPI pins the same LeanDB and
# leanontology revisions.
name = "leanreact"
version = "0.3.0"
defaultTargets = ["LeanReact", "LeanReactDomain", "LeanJS", "LeanReactServer", "AssistantUI"]

[[require]]
name = "leanontology"
git = "https://github.com/theoriclabs/leanontology"
rev = "322a4c12631dd8ece6ae9841a5e6b630d08d1e3b"

[[require]]
name = "leandb"
git = "https://github.com/theoriclabs/LeanDB"
rev = "d5253e5b0d83fc528927f340d1e50baab3e94999"

[[require]]
name = "leanapi"
git = "https://github.com/theoriclabs/leanapi"
rev = "b66c2991fae8fbe55b5c77d14b0216016855c6c0"

[[input_file]]
name = "leanJsRuntime"
path = "engine/LeanJS/Runtime.js"
text = true

# The UI core: components, hooks, DOM, forms, resources, router (portable, LeanJS-compiled).
[[lean_lib]]
name = "LeanReact"
srcDir = "engine"
roots = ["LeanReact", "LeanReact.Compiler"]

# Pages over typed endpoints: `form`, `call`, `load`, `App`, `path ==> page` (portable).
# Its imports below LeanReact are `LeanDb.Model`, `LeanApi.Core`, `LeanContract` and
# `LeanOntology` only.
[[lean_lib]]
name = "LeanReactDomain"
srcDir = "engine"
roots = ["LeanReact.Domain"]

# Full-stack serving (native): `app% Name where app := app`, the page routes and the browser
# bundle, on LeanAPI's native app. An API-only app never imports it.
[[lean_lib]]
name = "LeanReactServer"
srcDir = "engine"
roots = ["LeanReact.Server"]

[[lean_lib]]
name = "LeanJS"
srcDir = "engine"
needs = ["leanJsRuntime"]

# assistant-ui in Lean (portable): a typed chat thread over the assistant-ui React primitives.
# The host side is adapters/assistant-ui/index.mjs; see adapters/assistant-ui/README.md.
[[lean_lib]]
name = "AssistantUI"
srcDir = "adapters/assistant-ui"

[[lean_lib]]
name = "Examples"
srcDir = "examples/lean"

[[lean_lib]]
name = "Ordering"
srcDir = "examples/ordering"

[[lean_lib]]
name = "Cafe"
srcDir = "examples/ordering"

[[lean_lib]]
name = "PrivateNotes"
srcDir = "examples/security"
