# LeanReact UI libraries and the LeanJS compiler. Domain and client abstractions
# come from pinned LeanOntology, LeanDB and LeanAPI packages.
name = "leanreact"
version = "0.3.0"
defaultTargets = ["LeanReact", "LeanReactDomain", "LeanJS"]

[[require]]
name = "leanontology"
git = "https://github.com/theoriclabs/leanontology"
rev = "322a4c12631dd8ece6ae9841a5e6b630d08d1e3b"

[[require]]
name = "leandb"
git = "https://github.com/theoriclabs/LeanDB"
rev = "d5253e5b0d83fc528927f340d1e50baab3e94999"

[[require]]
name = "leanapi"
git = "https://github.com/theoriclabs/leanapi"
rev = "cd9a9d97b7709a251d42d015a4a039f1dc8a46bf"

[[input_file]]
name = "leanJsRuntime"
path = "engine/LeanJS/Runtime.js"
text = true

# The UI core: components, hooks, DOM, forms, resources, router (portable, LeanJS-compiled).
[[lean_lib]]
name = "LeanReact"
srcDir = "engine"
roots = ["LeanReact", "LeanReact.Compiler"]

# Pages over typed endpoints: `form`, `call`, `load`, `App`, `path ==> page` (portable).
# Its imports below LeanReact are `LeanDb.Model`, `LeanApi.Core`, `LeanContract` and
# `LeanOntology` only.
[[lean_lib]]
name = "LeanReactDomain"
srcDir = "engine"
roots = ["LeanReact.Domain"]

[[lean_lib]]
name = "LeanJS"
srcDir = "engine"
needs = ["leanJsRuntime"]

[[lean_lib]]
name = "Examples"
srcDir = "examples/lean"

# `lake exe leanreact build|dev|test <Module> …` (scripts/leanreact.mjs).
[[lean_exe]]
name = "leanreact"
srcDir = "engine"
root = "LeanReactCli"
