name = "tickets_native"
version = "0.1.0"
defaultTargets = ["tickets_server", "tickets_protocol", "tickets_checks", "tickets_http_checks"]
# Share the adapter's dependency checkouts (LA-12): one clone per pinned revision (leanhttp,
# leanws). The layers below LeanReact are development path pins on the sibling checkouts
# (`npm run test:manifest` accepts them; `--release` refuses them until DDD-LAPI-04).
packagesDir = "../../adapters/native/.lake/packages"

[[require]]
name = "leanreact"
path = "../.."

[[require]]
name = "leanapp_native"
path = "../../adapters/native"

# LeanDB, LeanAPI, leanontology and leansqlite come through the adapter as path dependencies on
# the sibling checkouts (development mode until DDD-LAPI-04 pins Git revisions).

[[require]]
name = "leanhttp"
git = "https://github.com/theoriclabs/leanhttp"
rev = "v0.3.1"

[[require]]
name = "leanws"
git = "https://github.com/theoriclabs/leanws"
rev = "40900ccb00e04186360ba0a235c560517b7ecb57"

[[lean_lib]]
name = "NativeTickets"

[[lean_exe]]
name = "tickets_server"
root = "ServerMain"

[[lean_exe]]
name = "tickets_protocol"
root = "ProtocolMain"

[[lean_exe]]
name = "tickets_checks"
root = "CheckMain"

[[lean_exe]]
name = "tickets_http_checks"
root = "HttpCheckMain"
