name: Release

# A pushed version tag (`v0.3.0`) becomes a GitHub release for the Lean version it supports.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: The tag matches lakefile.toml and the README's Lean versions table
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lean="$(sed -E 's/^leanprover\/lean4:v//' lean-toolchain)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "LeanReact $GITHUB_REF_NAME (Lean $lean)" \
            --notes "LeanReact $GITHUB_REF_NAME for Lean $lean (\`leanprover/lean4:v$lean\`). Pin it with \`rev = \"$GITHUB_REF_NAME\"\`; see the README's Lean versions table." \
            --generate-notes
