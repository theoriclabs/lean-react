name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: lake-cache
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Every Lake manifest is pinned to Git revisions
        run: node scripts/check-manifests.mjs
      - name: Build
        run: lake build
      - uses: actions/cache/save@v4
        if: steps.lake-cache.outputs.cache-hit != 'true'
        with:
          path: .lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compiler parity, runtime, integration, and boundary checks
        run: npm test
      - name: Documentation examples and links
        run: npm run test:docs
      - name: Compiler integration
        run: npm run test:compiler:integration
      - name: Browser checks
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:cli
